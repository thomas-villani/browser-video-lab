# release-please keeps a release pull request open from the Conventional Commits on main
# (version in package.json, CHANGELOG.md); merging it tags vX.Y.Z, makes the GitHub release and
# publishes the app to Pages.
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      released: ${{ steps.release.outputs.release_created }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v5

  pages:
    needs: release-please
    if: needs.release-please.outputs.released == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
